<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock jury report</title>
<!--
  HOW TO USE THIS TEMPLATE
  1. Do not edit this file by hand. The moderator writes the data to report-data.json and runs
     method/scripts/report.py, which validates the data and replaces only the
     <script id="panel-data"> block at the end of this file.
  2. "example": true only exists in the template; in a real report it is always false.
  3. The page builds itself from that block. The "launch" and "list" sections are optional.
  4. Every UI string comes from the <script id="default-labels"> block (English). When the report
     language is not English, the data carries a "labels" object with every key translated.
  Scores go from 1 to 5 and always mean "higher is better for the project".
  The "who" fields take the ids of users, experts and adversaries.
-->
<style>
/* Local fonts, in the fonts/ folder next to this file (OFL license, see fonts/OFL-*.txt).
   Without the folder, the page falls back to system fonts. */
@font-face{font-family:"Literata"; src:url("fonts/literata-latin.woff2") format("woff2"); font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Literata"; src:url("fonts/literata-latin-ext.woff2") format("woff2"); font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Schibsted Grotesk"; src:url("fonts/schibsted-grotesk-latin.woff2") format("woff2"); font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Schibsted Grotesk"; src:url("fonts/schibsted-grotesk-latin-ext.woff2") format("woff2"); font-weight:400 600; font-style:normal; font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --ground:#ECEEE8; --paper:#F7F8F4; --ink:#1C2420; --ink-2:#55615A; --rule:#CDD3CB;
  --felt:#2F4A3C; --felt-text:#E3EBE5;
  --against:#8C2F39; --for:#2F6B4E; --hyp:#2C5880;
  --soft-against:#F1E2E3; --soft-for:#E0ECE5; --soft-hyp:#E2E9F1;
  --n1:#8C2F39; --n1t:#FFFFFF; --n2:#D9A7A9; --n2t:#1C2420; --n3:#D6DAD2; --n3t:#1C2420;
  --n4:#9CC2AC; --n4t:#1C2420; --n5:#2F6B4E; --n5t:#FFFFFF;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#131916; --paper:#1B221E; --ink:#E4E9E3; --ink-2:#9DA9A1; --rule:#2F3A34;
    --felt:#24382D; --felt-text:#CFDCD3;
    --against:#E3929A; --for:#7EC5A1; --hyp:#93B6DB;
    --soft-against:#3A2327; --soft-for:#1E3329; --soft-hyp:#1F2C3B;
    --n1:#B4505B; --n1t:#FFFFFF; --n2:#6E3E45; --n2t:#F2E2E4; --n3:#38433D; --n3t:#E4E9E3;
    --n4:#2F6650; --n4t:#E3F3EA; --n5:#5DB28A; --n5t:#0F1A14;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:60px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.62; font-optical-sizing:auto}
a{color:inherit; text-decoration-color:var(--rule); text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:3px solid var(--hyp); outline-offset:3px; border-radius:3px}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; line-height:1.15}
p{margin:0 0 .75em}
.skip{position:absolute; left:-999px; top:8px; background:var(--paper); padding:8px 12px; font-family:var(--sans)}
.skip:focus{left:8px; z-index:10}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
.sans{font-family:var(--sans)}
.muted{color:var(--ink-2)}

/* Opening */
.opening{padding:40px 0 28px}
.opening .wrap{display:grid; gap:28px; align-items:center}
@media (min-width:900px){ .opening .wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:48px} }
.kind{font-family:var(--sans); font-size:15px; color:var(--ink-2); margin-bottom:10px}
h1{font-size:clamp(34px,6vw,54px); letter-spacing:-0.015em; max-width:16ch}
.when{font-family:var(--sans); font-size:15px; color:var(--ink-2); margin-top:14px; max-width:52ch}
.conclusions{margin-top:26px}
.conclusions h2{font-size:20px; margin-bottom:10px}
.conclusions ul{margin:0; padding:0; list-style:none}
.conclusions li{padding:10px 0 10px 18px; border-left:3px solid var(--felt); margin-bottom:8px; max-width:62ch; font-size:18px; line-height:1.5}
.notice{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); margin-top:18px; max-width:62ch}
.notice.example{color:var(--against); font-weight:600}

/* Round table */
.round-table{margin:0}
.round-table svg{width:100%; height:auto; display:block; max-width:620px; margin:0 auto}
.felt{fill:var(--felt)}
.table-edge{fill:none; stroke:var(--rule); stroke-width:1.5}
.center{fill:var(--felt-text); font-family:var(--sans); font-size:15px}
.center-strong{font-family:var(--serif); font-size:19px; font-weight:600}
.seat circle{stroke:var(--ground); stroke-width:3}
.seat text{font-family:var(--sans); font-size:12.5px; font-weight:600; pointer-events:none}
.seat.expert circle{fill:var(--paper); stroke:var(--ink); stroke-width:2.5}
.seat.adversary circle{fill:var(--paper); stroke:var(--against); stroke-width:2.5; stroke-dasharray:4 3}
.seat.expert text,.seat.adversary text{fill:var(--ink)}
.seat:hover circle,.seat:focus circle{stroke:var(--hyp); stroke-width:3.5}
.s1{fill:var(--n1)} .s2{fill:var(--n2)} .s3{fill:var(--n3)} .s4{fill:var(--n4)} .s5{fill:var(--n5)} .s0{fill:var(--paper)}
.t1{fill:var(--n1t)} .t2{fill:var(--n2t)} .t3{fill:var(--n3t)} .t4{fill:var(--n4t)} .t5{fill:var(--n5t)} .t0{fill:var(--ink)}
.round-table figcaption{font-family:var(--sans); font-size:14px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center; margin-top:8px}
.key{display:inline-flex; align-items:center; gap:6px}
.dot{display:inline-block; width:14px; height:14px; border-radius:50%}
.dot.exp{background:var(--paper); border:2px solid var(--ink)}
.dot.adv{background:var(--paper); border:2px dashed var(--against)}
.scale{display:inline-flex; gap:2px}
.scale i{display:inline-block; width:14px; height:14px; border-radius:3px}

/* Evidence as shape */
.ev{display:inline-flex; align-items:center; gap:7px; font-family:var(--sans); font-size:14.5px; white-space:nowrap}
.ev::before{content:""; width:12px; height:12px; border-radius:50%; border:2px solid currentColor; flex:none}
.ev.hypothesis::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.ev.proven::before{background:currentColor}
.ev.hypothesis{color:var(--hyp)} .ev.proven{color:var(--against)} .ev.observation{color:var(--ink-2)}
.ev-legend{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:16px}

/* Navigation */
nav.index{position:sticky; top:0; z-index:5; background:var(--ground); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
nav.index .wrap{display:flex; gap:20px; overflow-x:auto; white-space:nowrap; padding-top:11px; padding-bottom:11px}
nav.index a{font-family:var(--sans); font-size:15px; color:var(--ink-2); text-decoration:none}
nav.index a:hover{color:var(--ink)}

/* Sections */
main section{padding:52px 0 8px}
main section > .wrap > h2{font-size:clamp(26px,4vw,34px); letter-spacing:-0.01em}
.intro{font-family:var(--sans); font-size:15.5px; color:var(--ink-2); margin-top:8px; max-width:66ch}
.empty{font-family:var(--sans); color:var(--ink-2); font-style:italic; margin-top:16px}
.who{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); margin:0 0 6px}

/* Tensions: debate with a spine */
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
.filters button{font:inherit; font-family:var(--sans); font-size:14.5px; padding:6px 14px; border-radius:999px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.tension{margin-top:28px; padding-top:22px; border-top:1px solid var(--rule)}
.tension h3{font-size:23px; max-width:40ch}
.tension .signals{display:flex; flex-wrap:wrap; gap:6px 18px; margin:8px 0 16px}
.weight{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px}
.weight i{display:inline-block; width:8px; height:14px; border-radius:2px; background:var(--rule)}
.weight i.full{background:var(--ink)}
.debate{display:grid; gap:12px}
.debate .spine{display:none; background:var(--rule)}
@media (min-width:760px){ .debate{grid-template-columns:1fr 2px 1fr; gap:24px} .debate .spine{display:block} }
.side{padding:14px 16px; border-radius:6px}
.side.for{background:var(--soft-for)} .side.against{background:var(--soft-against)}
.side h4{font-family:var(--sans); font-size:15px; margin:0 0 4px}
.side.for h4{color:var(--for)} .side.against h4{color:var(--against)}
.side p:last-child{margin:0}
.outcome{display:grid; gap:4px 24px; margin:18px 0 0}
@media (min-width:760px){ .outcome{grid-template-columns:repeat(3,1fr)} }
.outcome div{border-top:2px solid var(--ink); padding-top:8px}
.outcome dt{font-family:var(--sans); font-size:14.5px; font-weight:600}
.outcome dd{margin:4px 0 0; font-size:16px}

/* Quick wins */
.point{margin-top:26px}
.point > h3{font-family:var(--sans); font-size:15px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
.change{display:grid; grid-template-columns:auto 1fr; gap:4px 18px; padding:16px 0; border-top:1px solid var(--rule)}
.tally{display:flex; flex-direction:column; gap:4px; font-family:var(--sans); font-size:14px; min-width:72px; padding-top:3px}
.tally .yes{color:var(--for); font-weight:600} .tally .no{color:var(--against); font-weight:600}
.change h4{font-family:var(--serif); font-size:19px; font-weight:600; margin:0 0 6px; max-width:52ch}
.change dl{display:grid; gap:6px 24px; margin:8px 0 6px}
@media (min-width:760px){ .change dl{grid-template-columns:1fr 1fr} }
.change dt{font-family:var(--sans); font-size:14.5px; font-weight:600}
.change dd{margin:2px 0 0}

/* Pitch problems, comparison, audience */
.quote{font-family:var(--serif); font-style:italic; border-left:3px solid var(--rule); padding-left:12px; margin:0 0 10px; max-width:66ch}
.status{display:inline-block; font-family:var(--sans); font-size:13.5px; font-weight:600; padding:2px 10px; border-radius:999px; margin-bottom:6px}
.status.resolved{background:var(--soft-for); color:var(--for)}
.status.partly{background:var(--soft-hyp); color:var(--hyp)}
.status.unresolved{background:var(--soft-against); color:var(--against)}
.status.new{background:var(--ink); color:var(--ground)}

/* What to test first */
ol.tests{list-style:none; counter-reset:test; margin:22px 0 0; padding:0}
ol.tests > li{counter-increment:test; display:grid; grid-template-columns:44px 1fr; gap:0 14px; padding:18px 0; border-top:1px solid var(--rule)}
ol.tests > li::before{content:counter(test); font-family:var(--serif); font-size:30px; font-weight:600; line-height:1; color:var(--felt)}
@media (prefers-color-scheme: dark){ ol.tests > li::before{color:var(--for)} }
ol.tests h3{font-size:20px; max-width:52ch}
.priority{font-family:var(--sans); font-size:14.5px; margin:6px 0 8px; color:var(--ink-2)}
.priority.high{color:var(--against); font-weight:600}
.pair{display:grid; gap:8px 24px}
@media (min-width:760px){ .pair{grid-template-columns:1fr 1fr} }
.pair dt{font-family:var(--sans); font-size:14.5px; font-weight:600}
.pair dd{margin:2px 0 0}

/* Risk matrix */
.risk-grid{display:grid; gap:28px; margin-top:22px}
@media (min-width:900px){ .risk-grid{grid-template-columns:360px 1fr; gap:40px; align-items:start} }
.matrix{display:grid; grid-template-columns:auto repeat(3,1fr); gap:4px; font-family:var(--sans); font-size:13.5px}
.matrix .axis{color:var(--ink-2); display:flex; align-items:center; justify-content:center; text-align:center; padding:4px}
.matrix .cell{min-height:74px; border-radius:6px; padding:6px; display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start; background:var(--paper); border:1px solid var(--rule)}
.matrix .cell.p4{background:var(--soft-against)} .matrix .cell.p6,.matrix .cell.p9{background:var(--soft-against); border-color:var(--against)}
.mark{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--ground); font-weight:600; text-decoration:none; font-size:14px}
.axis-title{font-family:var(--sans); font-size:13.5px; color:var(--ink-2); text-align:center; margin-top:6px}
ol.risks{margin:0; padding:0; list-style:none}
ol.risks li{display:grid; grid-template-columns:36px 1fr; gap:0 12px; padding:14px 0; border-top:1px solid var(--rule)}
ol.risks li:first-child{border-top:0; padding-top:0}
ol.risks .mark{width:30px; height:30px}
ol.risks h3{font-size:19px}
.label{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); margin:4px 0 6px}

/* Scores per persona */
.grid{margin-top:22px; overflow-x:auto}
.grid table{border-collapse:separate; border-spacing:3px; min-width:520px; width:100%; table-layout:fixed}
.grid th{font-family:var(--sans); font-weight:600; font-size:14px; color:var(--ink-2); text-align:center; vertical-align:bottom; padding:0 2px 6px; line-height:1.25}
.grid th.who-col{text-align:left; width:38%}
.grid td{padding:0}
.grid td.name{padding:8px 8px 8px 0; vertical-align:top}
.grid td.name button{all:unset; cursor:pointer; display:block}
.grid td.name button:focus-visible{outline:3px solid var(--hyp); outline-offset:3px}
.grid .name strong{display:block; font-size:16.5px}
.grid .name small{display:block; font-family:var(--sans); font-size:13.5px; color:var(--ink-2); line-height:1.35}
.grid .toggle{font-family:var(--sans); font-size:13px; color:var(--hyp)}
.score{height:44px; min-width:44px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-family:var(--sans); font-weight:600; font-size:16px}
.score.c1{background:var(--n1); color:var(--n1t)} .score.c2{background:var(--n2); color:var(--n2t)} .score.c3{background:var(--n3); color:var(--n3t)}
.score.c4{background:var(--n4); color:var(--n4t)} .score.c5{background:var(--n5); color:var(--n5t)} .score.c0{background:transparent; border:1px dashed var(--rule); color:var(--ink-2)}
.grid tr.mean td{padding-top:8px}
.grid tr.mean .score{font-size:15px}
.grid tr.card td{padding:2px 0 16px}
.card dl{display:grid; gap:10px 28px; margin:0; padding:14px 16px; background:var(--paper); border-radius:6px}
@media (min-width:760px){ .card dl{grid-template-columns:1fr 1fr} }
.card dt{font-family:var(--sans); font-size:14px; font-weight:600}
.card dd{margin:2px 0 0; font-size:16px}
.footnote{font-family:var(--sans); font-size:14.5px; color:var(--ink-2); margin-top:12px; max-width:70ch}

/* Opinions, adversaries, strengths, scenarios */
.columns{display:grid; gap:0 40px; margin-top:12px}
@media (min-width:760px){ .columns{grid-template-columns:1fr 1fr} }
.opinion{padding:18px 0; border-top:1px solid var(--rule)}
.opinion h3{font-size:20px; margin-bottom:6px}
.opinion dl{margin:10px 0 0}
.opinion dt{font-family:var(--sans); font-size:14.5px; font-weight:600; margin-top:8px}
.opinion dd{margin:2px 0 0}
.attack{margin-top:22px; padding:18px 20px; border-left:4px solid var(--against); background:var(--paper); border-radius:0 6px 6px 0}
.attack h3{font-size:20px}
.attack ol{margin:10px 0 0; padding-left:22px}
.attack li{margin-bottom:10px; max-width:70ch}
.attack li strong{display:block}
ul.plain{margin:16px 0 0; padding:0; list-style:none}
ul.plain > li{padding:14px 0; border-top:1px solid var(--rule); max-width:72ch}
ul.plain h3{font-size:19px; margin-bottom:4px}
.scenario .sit{font-weight:600}
.scenario .ev{margin-top:4px}
ol.order{margin:16px 0 0; padding-left:26px}
ol.order li{padding:8px 0; max-width:70ch}
.block{margin-top:18px; padding:18px 20px; background:var(--paper); border-radius:6px; max-width:760px}
.block h3{font-size:20px; margin-bottom:6px}
.block dl{margin:10px 0 0} .block dt{font-family:var(--sans); font-size:14.5px; font-weight:600; margin-top:8px} .block dd{margin:2px 0 0}
.block ul{margin:6px 0 0; padding-left:20px}
footer{margin-top:56px; padding:20px 0 48px; border-top:1px solid var(--rule); font-family:var(--sans); font-size:14.5px; color:var(--ink-2)}

@media print{
  nav.index,.filters,.skip{display:none}
  body{background:#fff; font-size:11pt}
  main section{padding-top:24px; break-inside:avoid-page}
  .tension,.opinion,ol.tests > li{break-inside:avoid}
  .grid tr.card{display:table-row !important}
}
</style>
</head>
<body>
<a class="skip" href="#content" id="skip-link">Skip to the report</a>
<header class="opening" id="top"><div class="wrap">
  <div id="opening-text"></div>
  <figure class="round-table" id="round-table"></figure>
</div></header>
<nav class="index" aria-label="Report sections" id="index-nav"><div class="wrap" id="index"></div></nav>
<main id="content"></main>
<footer><div class="wrap" id="footer"></div></footer>

<script type="application/json" id="default-labels">
{
  "pageTitle": "Mock jury: {concept}",
  "skipLink": "Skip to the report",
  "navLabel": "Report sections",
  "type_concept": "Concept evaluation, version {version}",
  "type_system": "System evaluation, version {version}",
  "type_change": "Evaluation of a change to the system, version {version}",
  "metaLine": "Evaluated on {date} by a {panelSize} of {composition}.",
  "exampleNotice": "Example data, written to show the format. No panel has run yet.",
  "conclusionsTitle": "What the panel concluded",
  "noConclusions": "The moderator recorded no conclusions.",
  "simulatedNotice": "The opinions in this report are simulated by language models. They are for finding contradictions, risks and questions; they do not measure real people's interest or predict acceptance.",
  "tableTitle": "The panel's table: {count} participants. Each seat leads to that persona's evaluation.",
  "centerExperts": "experts",
  "centerAdversaries": "adversaries",
  "seatScore": "{name}: {dimension} {score}",
  "seatExpert": "{name} (expert)",
  "seatAdversary": "{name} (adversary)",
  "legendScale": "{dimension}, 1 to 5",
  "legendExpert": "Expert",
  "legendAdversary": "Adversary",
  "evidence_observation": "observation",
  "evidence_hypothesis": "hypothesis",
  "evidence_proven": "proven problem",
  "level_1": "low",
  "level_2": "medium",
  "level_3": "high",
  "pitchTitle": "Pitch problems",
  "pitchNav": "Pitch",
  "pitchIntro": "Sentences or ideas in the short pitch that half of the users or more read differently from what was intended. These are problems of the text, not of the project: rewording is enough to fix them.",
  "pitchIntended": "What it meant to say",
  "pitchUnderstood": "How it was read",
  "pitchWho": "Read this way by {who}.",
  "comparisonTitle": "Since the previous version",
  "comparisonNav": "Changes",
  "comparisonIntro": "Each problem from the previous evaluation, checked against the current version, and the new problems the changes created.",
  "status_resolved": "resolved",
  "status_partly": "partly resolved",
  "status_unresolved": "not resolved",
  "status_new": "new",
  "audienceTitle": "Who it is for",

<script>
(function(){
  var D = JSON.parse(document.getElementById('panel-data').textContent);
  var DEF = JSON.parse(document.getElementById('default-labels').textContent);
  var LBL = D.labels || {};
  var m = D.meta || {};
  var SVG = 'http://www.w3.org/2000/svg';
  function L(key, vars){
    var t = (LBL[key] !== undefined) ? LBL[key] : (DEF[key] !== undefined ? DEF[key] : key);
    if(vars) for(var k in vars) t = t.split('{' + k + '}').join(vars[k]);
    return t;
  }
  function h(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = text; return e; }
  function s(tag, attrs, text){ var e = document.createElementNS(SVG, tag); for(var k in attrs) e.setAttribute(k, attrs[k]); if(text !== undefined) e.textContent = text; return e; }
  function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]) p.appendChild(arguments[i]); } return p; }
  function n(a){ return (a||[]).length; }
  var EV = {'observation':'observation', 'hypothesis':'hypothesis', 'proven problem':'proven'};
  function evClass(v){ return EV[v] || 'observation'; }
  function ev(v){ return h('span', 'ev ' + evClass(v), L('evidence_' + evClass(v))); }
  function level(x){ return L('level_' + x); }

  var langs = {'english':'en', 'brazilian portuguese':'pt-BR', 'portuguese':'pt', 'spanish':'es', 'french':'fr', 'german':'de', 'italian':'it'};
  document.documentElement.lang = langs[String(m.language || 'English').toLowerCase()] || 'en';
  document.getElementById('skip-link').textContent = L('skipLink');
  document.getElementById('index-nav').setAttribute('aria-label', L('navLabel'));
  var usersLabel = (m.usersLabel || 'Users');

  var names = {}, anchor = {};
  (D.users||[]).forEach(function(u){ names[u.id] = u.name; anchor[u.id] = 'p-' + u.id; });
  (D.experts||[]).forEach(function(e){ names[e.id] = e.role; anchor[e.id] = 'e-' + e.id; });
  (D.adversaries||[]).forEach(function(a){ names[a.id] = a.role; anchor[a.id] = 'a-' + a.id; });
  function who(list){ return (list||[]).map(function(q){ return names[q] || q; }).join(', '); }
  function pair(dl, term, value, wrap){
    if(!value) return;
    var target = dl;
    if(wrap){ target = h('div'); add(dl, target); }
    add(target, h('dt', null, term), h('dd', null, value));
  }

  /* Opening */
  var ot = document.getElementById('opening-text');
  var typeKey = {'system':'type_system', 'change':'type_change'}[m.type] || 'type_concept';
  add(ot, h('p', 'kind', L(typeKey, {version: m.version || '?'})));
  add(ot, h('h1', null, m.concept || '?'));
  add(ot, h('p', 'when', L('metaLine', {date: m.date || '?', panelSize: m.panelSize || '?', composition: m.composition || '?'})));
  if(m.example) add(ot, h('p', 'notice example', L('exampleNotice')));
  var conc = h('div', 'conclusions'); add(conc, h('h2', null, L('conclusionsTitle')));
  if(n(D.summary)){ var ul = h('ul'); D.summary.forEach(function(t){ add(ul, h('li', null, t)); }); add(conc, ul); }
  else add(conc, h('p', 'empty', L('noConclusions')));
  add(ot, conc);
  add(ot, h('p', 'notice', L('simulatedNotice')));
  document.title = L('pageTitle', {concept: m.concept || ''});

  /* Round table */
  var dims = D.dimensions || [], users = D.users || [];
  var lastDim = dims[dims.length - 1];
  var seats = [];
  users.forEach(function(u){ seats.push({id:u.id, name:u.name, group:'user', score:lastDim ? (u.scores||{})[lastDim.id] : null}); });
  (D.experts||[]).forEach(function(e){ seats.push({id:e.id, name:e.role, group:'expert'}); });
  (D.adversaries||[]).forEach(function(a){ seats.push({id:a.id, name:a.role, group:'adversary'}); });
  var fig = document.getElementById('round-table');
  if(seats.length){
    var W = 620, H = 430, cx = W/2, cy = H/2, rx = 190, ry = 120;
    var svg = s('svg', {viewBox:'0 0 ' + W + ' ' + H, role:'img', 'aria-labelledby':'table-title'});
    add(svg, s('title', {id:'table-title'}, L('tableTitle', {count: seats.length})));
    add(svg, s('ellipse', {cx:cx, cy:cy, rx:rx + 6, ry:ry + 6, 'class':'table-edge'}));
    add(svg, s('ellipse', {cx:cx, cy:cy, rx:rx, ry:ry, 'class':'felt'}));
    [[users.length, usersLabel.toLowerCase()], [n(D.experts), L('centerExperts')], [n(D.adversaries), L('centerAdversaries')]].forEach(function(c, i){
      var t = s('text', {x:cx, y:cy - 26 + i*28, 'text-anchor':'middle', 'class':'center'});
      add(t, s('tspan', {'class':'center-strong'}, String(c[0])));
      add(t, s('tspan', {dx:'6'}, c[1]));
      add(svg, t);
    });
    var N = seats.length;
    var small = ['the','of','and','a','an','to','in','on','for','with','who','que','de','do','da','dos','das','com','sem','em','no','na','para','por','e','o','os','as','um','uma'];
    seats.forEach(function(l, i){
      var ang = -Math.PI/2 + (2*Math.PI*i)/N;
      var x = cx + (rx + 46) * Math.cos(ang), y = cy + (ry + 46) * Math.sin(ang);
      var a = s('a', {href:'#' + anchor[l.id], 'class':'seat ' + l.group});
      var sc = (typeof l.score === 'number') ? l.score : 0;
      var title = l.group === 'user' ? L('seatScore', {name:l.name, dimension: lastDim ? lastDim.name : '', score: sc || L('noScore')})
                : L(l.group === 'expert' ? 'seatExpert' : 'seatAdversary', {name:l.name});
      add(a, s('title', {}, title));
      add(a, s('circle', {cx:x, cy:y, r:22, 'class':l.group === 'user' ? 's' + sc : ''}));
      var ini = l.name.split(/\s+/).filter(function(p){ return small.indexOf(p.toLowerCase()) < 0 && /^[A-Za-zÀ-ú]/.test(p); }).slice(0,2).map(function(p){ return p.charAt(0).toUpperCase(); }).join('') || l.name.slice(0,2);
      add(a, s('text', {x:x, y:y + 4.5, 'text-anchor':'middle', 'class':l.group === 'user' ? 't' + sc : ''}, ini));
      add(svg, a);
    });
    add(fig, svg);
    var cap = h('figcaption');
    var k1 = h('span', 'key'); var sca = h('span', 'scale'); [1,2,3,4,5].forEach(function(k){ var i = h('i'); i.style.background = 'var(--n' + k + ')'; add(sca, i); });
    add(k1, sca); k1.appendChild(document.createTextNode(L('legendScale', {dimension: lastDim ? lastDim.name : ''})));
    var k2 = h('span', 'key'); add(k2, h('span', 'dot exp')); k2.appendChild(document.createTextNode(L('legendExpert')));
    var k3 = h('span', 'key'); add(k3, h('span', 'dot adv')); k3.appendChild(document.createTextNode(L('legendAdversary')));
    add(cap, k1, k2, k3); add(fig, cap);
  } else fig.remove();

  /* Sections */
  var main = document.getElementById('content'), index = document.getElementById('index');
  function section(id, title, navText, intro){
    var sec = h('section'); sec.id = id; var w = h('div', 'wrap'); add(sec, w);
    add(w, h('h2', null, title)); if(intro) add(w, h('p', 'intro', intro));
    main.appendChild(sec);
    var a = h('a', null, navText); a.href = '#' + id; add(index, a);
    return w;
  }
  function empty(w, t){ add(w, h('p', 'empty', t || L('emptySection'))); }

  /* Pitch problems (optional) */
  if(n(D.pitchIssues)){
    var wpi = section('pitch', L('pitchTitle'), L('pitchNav'), L('pitchIntro'));
    var upi = h('ul', 'plain');
    D.pitchIssues.forEach(function(x){
      var li = h('li'); add(li, h('p', 'quote', x.sentence));
      var dl = h('dl', 'pair'); pair(dl, L('pitchIntended'), x.intended, true); pair(dl, L('pitchUnderstood'), x.understoodAs, true); add(li, dl);
      if(n(x.who)) add(li, h('p', 'who', L('pitchWho', {who: who(x.who)})));
      add(upi, li);
    });
    add(wpi, upi);
  }

  /* Since the previous version (optional) */
  if(n(D.comparison)){
    var wcm = section('comparison', L('comparisonTitle'), L('comparisonNav'), L('comparisonIntro'));
    var rank = {'unresolved':0, 'new':1, 'partly':2, 'resolved':3};
    var ucm = h('ul', 'plain');
    D.comparison.slice().sort(function(a,b){ return (rank[a.status]||0) - (rank[b.status]||0); }).forEach(function(x){
      var li = h('li'); add(li, h('span', 'status ' + (rank[x.status] !== undefined ? x.status : 'new'), L('status_' + x.status)));
      add(li, h('h3', null, x.problem)); if(x.note) add(li, h('p', null, x.note));
      add(ucm, li);
    });
    add(wcm, ucm);
  }

  /* Where the panel split */
  var wt = section('tensions', L('tensionsTitle'), L('tensionsNav'), L('tensionsIntro'));
  var leg = h('div', 'ev-legend'); add(leg, ev('observation'), ev('hypothesis'), ev('proven problem'));
  add(wt, leg);
  add(wt, h('p', 'intro', L('provenRule')));
  var tens = (D.tensions||[]).slice().sort(function(a,b){ return (b.severity||0) - (a.severity||0); });
  if(tens.length){
    var kinds = []; tens.forEach(function(t){ if(kinds.indexOf(t.evidence) < 0) kinds.push(t.evidence); });
    var filters = h('div', 'filters'); filters.setAttribute('role', 'group'); filters.setAttribute('aria-label', L('filterGroup'));
    var cards = [];
    function apply(kind){
      cards.forEach(function(c){ c.el.hidden = !(kind === 'all' || c.kind === kind); });
      Array.prototype.forEach.call(filters.children, function(b){ b.setAttribute('aria-pressed', b.dataset.kind === kind ? 'true' : 'false'); });
    }
    ['all'].concat(kinds).forEach(function(t){
      var label = t === 'all' ? L('filterAll', {count: tens.length}) : L('evidence_' + evClass(t));
      var b = h('button', null, label.charAt(0).toUpperCase() + label.slice(1));
      b.type = 'button'; b.dataset.kind = t; b.addEventListener('click', function(){ apply(t); }); add(filters, b);
    });
    if(kinds.length > 1) add(wt, filters);
    tens.forEach(function(t){
      var art = h('article', 'tension'); add(art, h('h3', null, t.title));
      var sig = h('div', 'signals'); add(sig, ev(t.evidence));
      if(t.severity){ var p = h('span', 'weight'); for(var k=1;k<=3;k++){ add(p, h('i', k <= t.severity ? 'full' : '')); } p.appendChild(document.createTextNode(L('severity', {level: level(t.severity)}))); add(sig, p); }
      add(art, sig);
      var deb = h('div', 'debate');
      [['for','sideFor'],['against','sideAgainst']].forEach(function(pp, i){
        var side = t[pp[0]] || {};
        var box = h('div', 'side ' + pp[0]); add(box, h('h4', null, L(pp[1])));
        if(n(side.who)) add(box, h('p', 'who', who(side.who)));
        add(box, h('p', null, side.text || '')); add(deb, box);
        if(i === 0) add(deb, h('div', 'spine'));
      });
      add(art, deb);
      var dl = h('dl', 'outcome');
      pair(dl, L('proposal'), t.proposal, true); pair(dl, L('loss'), t.loss, true); pair(dl, L('experiment'), t.experiment, true);
      add(art, dl); add(wt, art); cards.push({el:art, kind:t.evidence});
    });
    apply('all');
  } else empty(wt, L('noTensions'));

  /* Quick wins */
  var wsc = section('quick-wins', L('quickWinsTitle'), L('quickWinsNav'), L('quickWinsIntro'));
  var sc = D.quickWins || [];
  if(sc.length){
    var order = [], byPoint = {};
    sc.forEach(function(c){ var k = c.point || ''; if(!(k in byPoint)){ byPoint[k] = []; order.push(k); } byPoint[k].push(c); });
    order.forEach(function(k){
      var g = h('div', 'point'); if(k) add(g, h('h3', null, k));
      byPoint[k].slice().sort(function(a,b){ return n(b.support) - n(a.support); }).forEach(function(c){
        var row = h('article', 'change');
        var t = h('div', 'tally');
        add(t, h('span', 'yes', L('tallyFor', {count: n(c.support)})), h('span', 'no', L('tallyAgainst', {count: n(c.against)})));
        var body = h('div'); add(body, h('h4', null, c.change));
        var dl = h('dl'); pair(dl, L('quickWinSolves'), c.solves, true); pair(dl, L('quickWinLoss'), c.loss, true); add(body, dl);
        if(n(c.proposedBy)) add(body, h('p', 'who', L('quickWinProposedBy', {who: who(c.proposedBy)})));
        if(n(c.support)) add(body, h('p', 'who', L('quickWinSupport', {who: who(c.support)})));
        if(n(c.against)) add(body, h('p', 'who', L('quickWinAgainst', {who: who(c.against)})));
        add(row, t, body); add(g, row);
      });
      add(wsc, g);
    });
  } else empty(wsc, L('noQuickWins'));

  /* Who it is for (optional) */
  if(n(D.audienceSplit)){
    var wau = section('audience', L('audienceTitle'), L('audienceNav'), L('audienceIntro'));
    var col = h('div', 'columns');
    D.audienceSplit.forEach(function(x){
      var art = h('article', 'opinion'); add(art, h('h3', null, x.group));
      var dl = h('dl'); pair(dl, L('audienceWants'), x.wants); pair(dl, L('audienceCost'), x.cost); add(art, dl);
      if(n(x.who)) add(art, h('p', 'who', L('audienceWho', {who: who(x.who)})));
      add(col, art);
    });
    add(wau, col);
  }

  /* What to test first */
  var wh = section('test', L('testTitle'), L('testNav'), L('testIntro'));
  var prio = {'high':0, 'medium':1, 'low':2};
  var hyp = (D.hypotheses||[]).slice().sort(function(a,b){ return (prio[a.priority]||0) - (prio[b.priority]||0); });
  if(hyp.length){
    var ol = h('ol', 'tests');
    hyp.forEach(function(x){
      var li = h('li'), body = h('div'); add(li, body);
      add(body, h('h3', null, x.hypothesis));
      var pr = prio[x.priority] !== undefined ? L('priority_' + x.priority) : L('priorityUnknown');
      add(body, h('p', 'priority' + (x.priority === 'high' ? ' high' : ''), L('priorityLine', {priority: pr})));
      var dl = h('dl', 'pair'); pair(dl, L('howToTest'), x.test, true); pair(dl, L('signal'), x.signal, true); add(body, dl);
      add(ol, li);
    });
    add(wh, ol);
  } else empty(wh);

  /* Risks */
  var wr = section('risks', L('risksTitle'), L('risksNav'), L('risksIntro'));
  var risks = (D.risks||[]).slice().sort(function(a,b){ return (b.severity*b.likelihood) - (a.severity*a.likelihood); });
  if(risks.length){
    var gr = h('div', 'risk-grid');
    var leftCol = h('div');
    var mat = h('div', 'matrix'); mat.setAttribute('role', 'img'); mat.setAttribute('aria-label', L('matrixLabel'));
    [3,2,1].forEach(function(g){
      add(mat, h('div', 'axis', L('severityAxis', {level: level(g)})));
      [1,2,3].forEach(function(p){
        var cell = h('div', 'cell p' + (g*p));
        risks.forEach(function(r, i){ if(r.severity === g && r.likelihood === p){ var a = h('a', 'mark', String(i+1)); a.href = '#r-' + (i+1); a.title = r.title; add(cell, a); } });
        add(mat, cell);
      });
    });
    add(mat, h('div', 'axis', ''));
    [1,2,3].forEach(function(p){ add(mat, h('div', 'axis', level(p))); });
    add(leftCol, mat, h('p', 'axis-title', L('likelihoodAxis')));
    var lr = h('ol', 'risks');
    risks.forEach(function(r, i){
      var li = h('li'); li.id = 'r-' + (i+1);
      add(li, h('span', 'mark', String(i+1)));
      var c = h('div'); add(c, h('h3', null, r.title));
      var vars = {severity: level(r.severity), likelihood: level(r.likelihood), category: r.category ? L('category_' + r.category) : ''};
      add(c, h('p', 'label', L(r.category ? 'riskLineCategory' : 'riskLine', vars)));
      add(c, h('p', null, r.description));
      if(n(r.who)) add(c, h('p', 'who', L('pointedOutBy', {who: who(r.who)})));
      add(li, c); add(lr, li);
    });
    add(gr, leftCol, lr); add(wr, gr);
  } else empty(wr);

  /* Scores per persona */
  var wm = section('scores', L('scoresTitle'), L('scoresNav'), L('scoresIntro'));
  if(dims.length && users.length){
    var box = h('div', 'grid'), tb = h('table'), thead = h('thead'), trh = h('tr');
    var th0 = h('th', 'who-col', usersLabel); th0.scope = 'col'; add(trh, th0);
    dims.forEach(function(d){ var th = h('th', null, d.name); th.scope = 'col'; th.title = d.description || ''; add(trh, th); });
    add(thead, trh); add(tb, thead);
    var tbody = h('tbody');
    users.forEach(function(u){
      var tr = h('tr'); tr.id = 'p-' + u.id;
      var tdn = h('td', 'name'), bt = h('button');
      bt.type = 'button'; bt.setAttribute('aria-expanded', 'false');
      add(bt, h('strong', null, u.name));
      add(bt, h('small', null, u.model ? L('profileModel', {profile: u.profile || '', model: u.model}) : (u.profile || '')));
      var tog = h('span', 'toggle', L('readEvaluation')); add(bt, tog);
      add(tdn, bt); add(tr, tdn);
      dims.forEach(function(d){
        var v = (u.scores||{})[d.id], td = h('td'), c = h('div', 'score c' + (v || 0), v ? String(v) : '–');
        c.setAttribute('aria-label', L('scoreAria', {dimension: d.name, score: v ? String(v) : L('noScore')})); add(td, c); add(tr, td);
      });
      var trc = h('tr', 'card'); trc.hidden = true;
      var tdc = h('td'); tdc.colSpan = dims.length + 1;
      var cdl = h('dl'); pair(cdl, L('understood'), u.understood, true); pair(cdl, L('attracted'), u.attracted, true); pair(cdl, L('putOff'), u.putOff, true); pair(cdl, L('dropOut'), u.dropOut, true);
      add(tdc, cdl); add(trc, tdc);
      bt.addEventListener('click', function(){ var open = trc.hidden; trc.hidden = !open; bt.setAttribute('aria-expanded', open ? 'true' : 'false'); tog.textContent = open ? L('close') : L('readEvaluation'); });
      add(tbody, tr, trc);
    });
    var showMean = m.audienceDefined !== false;
    if(showMean){
      var trm = h('tr', 'mean'); add(trm, h('td', 'name muted sans', L('panelMean')));
      dims.forEach(function(d){
        var vals = users.map(function(u){ return (u.scores||{})[d.id]; }).filter(function(v){ return typeof v === 'number'; });
        var avg = vals.length ? vals.reduce(function(a,b){ return a+b; }, 0)/vals.length : 0;
        var sep = document.documentElement.lang === 'en' ? '.' : ',';
        var td = h('td'); add(td, h('div', 'score c' + (avg ? Math.max(1, Math.min(5, Math.round(avg))) : 0), avg ? avg.toFixed(1).replace('.', sep) : '–')); add(trm, td);
      });
      add(tbody, trm);
    }
    add(tb, tbody); add(box, tb); add(wm, box);
    if(!showMean) add(wm, h('p', 'footnote', L('noMeanNote')));
    add(wm, h('p', 'footnote', L('scoresNote')));
  } else empty(wm);

  /* Experts and adversaries */
  var we = section('experts', L('expertsTitle'), L('expertsNav'));
  if(n(D.experts)){
    var col = h('div', 'columns');
    D.experts.forEach(function(e){
      var art = h('article', 'opinion'); art.id = 'e-' + e.id;
      add(art, h('h3', null, e.role), h('p', null, e.opinion));
      var dl = h('dl'); pair(dl, L('mainProblem'), e.mainProblem); pair(dl, L('recommendation'), e.recommendation); add(art, dl); add(col, art);
    });
    add(we, col);
  } else empty(we);

  var wa = section('adversaries', L('adversariesTitle'), L('adversariesNav'), L('adversariesIntro'));
  if(n(D.adversaries)){
    D.adversaries.forEach(function(a){
      var art = h('article', 'attack'); art.id = 'a-' + a.id; add(art, h('h3', null, a.role));
      var ol2 = h('ol');
      (a.arguments||[]).forEach(function(g){ var li = h('li'); add(li, h('strong', null, g.title)); li.appendChild(document.createTextNode(g.text)); add(ol2, li); });
      add(art, ol2); add(wa, art);
    });
  } else empty(wa);

  /* Strengths */
  var wf = section('strengths', L('strengthsTitle'), L('strengthsNav'), L('strengthsIntro'));
  if(n(D.strengths)){
    var uf = h('ul', 'plain');
    D.strengths.forEach(function(f){ var li = h('li'); add(li, h('h3', null, f.title), h('p', null, f.description)); if(n(f.who)) add(li, h('p', 'who', L('citedBy', {who: who(f.who)}))); add(uf, li); });
    add(wf, uf);
  } else empty(wf);

  /* Scenarios */
  var wc = section('scenarios', L('scenariosTitle'), L('scenariosNav'), L('scenariosIntro'));
  if(n(D.scenarios)){
    var uc = h('ul', 'plain');
    D.scenarios.forEach(function(c){ var li = h('li', 'scenario'); add(li, h('p', 'sit', c.situation), h('p', null, c.outcome)); if(c.classification) add(li, ev(c.classification)); add(uc, li); });
    add(wc, uc);
  } else empty(wc);

  /* Gaps */
  var wg = section('gaps', L('gapsTitle'), L('gapsNav'), L('gapsIntro'));
  if(n(D.gaps)){ var ug = h('ul', 'plain'); D.gaps.forEach(function(t){ add(ug, h('li', null, t)); }); add(wg, ug); } else empty(wg);

  /* Ranked list (optional) */
  var nl = D.list;
  if(nl && n(nl.order)){
    var wn = section('list', nl.title || L('listTitle'), L('listNav'), L('listIntro'));
    var oln = h('ol', 'order');
    nl.order.forEach(function(x){
      var li = h('li'); add(li, h('strong', null, x.name)); add(li, h('p', null, x.comment || ''));
      if(n(x.first)) add(li, h('p', 'who', L('firstFor', {who: who(x.first)})));
      if(n(x.rejected)) add(li, h('p', 'who', L('rejectedBy', {who: who(x.rejected)})));
      add(oln, li);
    });
    add(wn, oln);
    if(nl.note){ var bn = h('div', 'block'); add(bn, h('h3', null, L('externalCheck')), h('p', null, nl.note)); add(wn, bn); }
  }

  /* Launch (optional) */
  var lc = D.launch;
  if(lc && lc.recommendation){
    var wp = section('launch', lc.title || L('launchTitle'), L('launchNav'), lc.intro || L('launchIntro'));
    var bp = h('div', 'block'); add(bp, h('h3', null, lc.recommendation));
    if(n(lc.reasons)){ var um = h('ul'); lc.reasons.forEach(function(t){ add(um, h('li', null, t)); }); add(bp, um); }
    var dp = h('dl');
    if(n(lc.preferences)) pair(dp, L('preferences'), lc.preferences.map(function(p){ return (names[p.who] || p.who) + ': ' + p.where; }).join('; ') + '.');
    pair(dp, L('caveats'), lc.caveats); add(bp, dp); add(wp, bp);
  }

  /* Method */
  var wmt = section('method', L('methodTitle'), L('methodNav'));
  var olr = h('ol', 'order');
  [1,2,3,4,5].forEach(function(i){ add(olr, h('li', null, L('method_' + i, {usersLabel: usersLabel.toLowerCase()}))); });
  add(wmt, olr);
  if(n(D.limits)){
    var bl = h('div', 'block'); add(bl, h('h3', null, L('limitsTitle')));
    var ul3 = h('ul'); D.limits.forEach(function(t){ add(ul3, h('li', null, t)); }); add(bl, ul3); add(wmt, bl);
  }

  add(document.getElementById('footer'), h('p', null, L('footer')));
})();
</script>
</body>
</html>
