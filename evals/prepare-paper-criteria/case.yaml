schema_version: "1.1"
name: prepare-paper-criteria
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The author asks for a peer-review style jury on a short fictional paper and gives the journal's
  guidelines. The skill prepares a panel of type work and family criteria: the paper goes into the
  panel verbatim (input/02-work.md), the short pitch is the paper's own abstract verbatim, the
  journal's guidelines are saved verbatim in input/03-criteria.md and become 3 to 7 criteria in
  config.md, each written as a question. The cover letter's arguments for the paper are not passed to
  the panel: they are recorded in prep/removed.md. The bench has six jurors with distinct profiles,
  three per model, with a strict and a lenient juror on each model, and the destroyer is written as the
  harshest reviewer. It assembles panel/ and stops, as the request says, without launching the run.
