schema_version: "1.1"
name: run-game-no-stops
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The session is in a panel folder assembled with a fictional game concept (a two-player co-op
  lighthouse game, version 0.1, active name list, Language: English). The skill enters Run, reads method/ and performs the environment check
  (version, context exclusions, read outside the folder refused, persona-isolated without tools, a
  real test of the web tool, coherence, inputs). It records the plan in progress.md and continues
  without stops through the five rounds (one file per round, no clarity score, a comprehension check
  for pitch problems, the contrarian's second call with requested answers, settled items sent straight
  to consolidation, and no panel average because the audience is undefined), saving full prompts and unedited answers, without passing
  the author's concerns or the config to any agent, and ends with a validated report.html.
  WARNING: this is a full run (about 50 to 70 agent calls).
